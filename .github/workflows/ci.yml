name: CLI checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Verify pinned native CLI protocols (no credentials or model calls)
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix tools/agents
          node tools/agents/bootstrap.mjs
          export PATH="$PWD/tools/agents/native:$PWD/tools/agents/node_modules/.bin:$PATH"
          node --input-type=module -e "import { probeCodex } from './dist/provider.js'; import { probeNative } from './dist/native-providers.js'; const s = AbortSignal.timeout(30000); console.log(await probeCodex(s)); console.log(await probeNative('claude', s)); console.log(await probeNative('grok', s));"
